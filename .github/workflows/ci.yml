name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Portability probe
        run: uv run python probe_portability.py

      - name: Test
        run: uv run pytest --tb=short

      # pyproject sets `addopts = "-m 'not slow'"`, so the step above skips the
      # acceptance replays. Those are the only multi-observation, full-control
      # regressions there are; leaving them out of CI meant nothing here noticed
      # if certified behaviour drifted.
      - name: Test (slow acceptance replays)
        run: uv run pytest -m slow --tb=short

      - name: Build wheel
        run: uv build

      - name: Smoke-test installed entry points
        run: uv run python scripts/check_wheel_entrypoints.py dist/*.whl python3
