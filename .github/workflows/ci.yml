name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# A later push to the same pull request cancels the run it supersedes. The
# workflow prefix keeps other workflows out of the group; the draft suffix
# stops a skipped draft run from cancelling the real run that marking the
# pull request ready starts; pushes to main key on run_id so one merge never
# cancels or displaces another's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: true

jobs:
  test:
    # Draft pull requests are not tested: review rounds push often, and only a
    # head that could merge is worth the minutes. Marking the pull request
    # ready tests that exact head. A skipped run is not a passing one.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest --tb=short

      # pyproject sets `addopts = "-m 'not slow'"`, so the step above skips the
      # acceptance replays. Those are the only multi-observation, full-control
      # regressions there are; leaving them out of CI meant nothing here noticed
      # if certified behaviour drifted.
      - name: Test (slow acceptance replays)
        run: uv run pytest -m slow --tb=short

      - name: Build wheel
        run: uv build

      - name: Smoke-test installed entry points
        run: uv run python scripts/check_wheel_entrypoints.py dist/*.whl python3
