name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments run one at a time. A later push does not cancel a build or
# deployment already under way, and up to 100 waiting runs are queued rather
# than replaced.
concurrency:
  group: pages
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Render site
        run: |
          cd site
          uv run --frozen quarto render
      - name: Check rendered site
        run: |
          uv run --frozen python scripts/check_site_links.py
          uv run --frozen python scripts/check_site_figures.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages keeps its own 10-minute clock; leave room around it.
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
