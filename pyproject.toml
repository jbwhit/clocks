[project]
name = "clocks"
version = "0.1.0"
description = "Gravitational time dilation simulation and inference library"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.scripts]
demo-1d = "clocks._cli:demo_1d"
demo-2d = "clocks._cli:demo_2d"
demo-multi-mass = "clocks._cli:demo_multi_mass"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
