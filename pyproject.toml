[project]
name = "clocks"
version = "0.1.0"
description = "Gravitational time dilation simulation and inference library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[project.urls]
Repository = "https://github.com/jbwhit/clocks"
Documentation = "https://jbwhit.github.io/clocks/"

[project.scripts]
demo-1d = "clocks._cli:demo_1d"
demo-2d = "clocks._cli:demo_2d"
demo-multi-mass = "clocks._cli:demo_multi_mass"
demo-multi-mass-2d = "clocks._cli:demo_multi_mass_2d"
demo-model-comparison = "clocks._cli:demo_model_comparison"
demo-density = "clocks._cli:demo_density"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv]
# Supply-chain cooldown: ignore packages released in the last 7 days when
# re-locking. Project-level so CI and contributors resolve the lockfile
# identically to the machine that wrote it (a machine-local-only policy
# makes `uv sync --locked` fail everywhere else).
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running acceptance scans (run with `uv run pytest -m slow`)",
]
